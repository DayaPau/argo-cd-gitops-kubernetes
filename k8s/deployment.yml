
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gitops
  annotations:
    gitops.udla.edu.ec/prueba: "sincronizacion-automatica"
  labels:
    app: web-gitops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web-gitops

  template:
    metadata:
      labels:
        app: web-gitops

    spec:
      containers:
        - name: nginxx  
          image: nginx:stable-alpine
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
